<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W.T.T.G. - Terminal Głównego Węzła</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal">
        <div id="output">
            <p>> INICJALIZACJA SYSTEMU TRWA...</p>
            <p>> NAWIĄZYWANIE BEZPIECZNEGO POŁĄCZENIA... OK.</p>
            <p>> Wprowadź 8-znakowy klucz deszyfrujący, aby uzyskać dostęp do ukrytego ładunku.</p>
        </div>
        <div class="input-line">
            <span class="prompt">></span>
            <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
